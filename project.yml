name: KinClawMac
options:
  bundleIdPrefix: dev.localkin
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"

targets:
  KinClawMac:
    type: application
    platform: macOS
    sources:
      - KinClawMac
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        INFOPLIST_FILE: KinClawMac/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.localkin.kinclawmac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Hardened Runtime + entitlements come back at M6 (signing milestone)
    info:
      path: KinClawMac/Info.plist
      properties:
        CFBundleDisplayName: KinClaw Mac
        CFBundleName: KinClawMac
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        # Run as menubar-only app (no Dock icon)
        LSUIElement: true
        # Microphone permission (voice mode)
        NSMicrophoneUsageDescription: "KinClaw uses your microphone for voice mode — push-to-talk to any agent."
        # Speech recognition (local STT fallback when server unreachable)
        NSSpeechRecognitionUsageDescription: "KinClaw uses on-device speech recognition as a local fallback when remote STT is unavailable."
        # Accessibility permission (when invoking local KinClaw computer-use)
        NSAppleEventsUsageDescription: "KinClaw needs Apple Events access to coordinate with the local kinclaw daemon for computer-use tasks."
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "Copyright © 2026 LocalKinAI. Apache-2.0 licensed."
