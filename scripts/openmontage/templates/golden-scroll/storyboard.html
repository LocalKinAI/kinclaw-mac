<body>
<header><h1>一卷展开的手卷<small>storyboard v1</small></h1>
<p>faith.localkin.ai 的时间卷轴：跨越十九个世纪的属灵先贤是一条从未断过的传承——他们今天仍在说话。每格是该帧的关键一刻（静止草图，动作见每格下方的说明）。</p>
<span class="tag">1920×1080 · 100s · 10 FRAMES · 女声旁白</span></header>
<main>
<div class="act">第一幕 · 开卷</div>
<figure class="cell"><div class="frame" id="frame-01"><div class="scroll f01"><i class="edge t"></i><i class="edge b"></i><i class="ink" style="left:3.5cqw;width:2.6cqw;opacity:0.55"></i><i class="ink" style="left:6.8cqw;width:1.4cqw;opacity:0.5"></i><i class="ink" style="left:8.9cqw;width:3.1cqw;opacity:0.45"></i><i class="ink" style="left:12.6cqw;width:1.9cqw;opacity:0.4"></i><i class="ink" style="left:15.2cqw;width:2.4cqw;opacity:0.34"></i><i class="ink" style="left:18.3cqw;width:1.2cqw;opacity:0.28"></i><i class="ink" style="left:20.2cqw;width:2.8cqw;opacity:0.22"></i><i class="ink" style="left:23.7cqw;width:1.6cqw;opacity:0.16"></i><i class="ink" style="left:26.0cqw;width:2.2cqw;opacity:0.11"></i><i class="ink" style="left:29.1cqw;width:1.3cqw;opacity:0.07"></i></div><i class="roller" style="left:19.4cqw;top:12.2cqw;height:30.4cqw"></i><i class="bloom " style="left:29cqw;top:27cqw;width:64cqw;height:64cqw"></i><div class="chrome">faith.localkin.ai</div><div class="cap"><span class="c-sp">每一寸 都写着</span><span class="c-act">一个名字</span><span class="c-up"></span></div></div><figcaption><div class="lab"><span>01 · 把一千九百年铺成一卷纸</span><span>frame-01 · 0.0–10.3s</span></div><p class="note"><b>烛光先亮。</b>黑场里只有一团烛光（约 0.8 秒），手卷从左端的轴往右展开；说到「每一寸」时，纸上浮出一行看不清的金墨字迹——是质感，不是内容。</p><span class="chip">→ cut</span></figcaption></figure>
<figure class="cell"><div class="frame" id="frame-02"><div class="count"><span class="num">15</span><span class="unit">个时代</span><span class="sep">·</span><span class="num">57</span><span class="unit">位先贤</span></div><div class="scroll f02"><i class="edge t"></i><i class="edge b"></i></div><i class="roller" style="left:2.2cqw;top:24.4cqw;height:14.2cqw"></i><i class="bloom wide" style="left:50cqw;top:31cqw;width:96cqw;height:96cqw"></i><i class="thread f02"></i><div class="tk up" style="left:6.20cqw"><i></i><span>130</span></div><div class="tk dn" style="left:12.50cqw"><i></i><span>296–430</span></div><div class="tk up" style="left:18.80cqw"><i></i><span>14–15c</span></div><div class="tk dn" style="left:25.10cqw"><i></i><span>1483–1564</span></div><div class="tk up" style="left:31.40cqw"><i></i><span>1515–1717</span></div><div class="tk dn" style="left:37.70cqw"><i></i><span>1554–1633</span></div><div class="tk up" style="left:44.00cqw"><i></i><span>1615–1714</span></div><div class="tk dn" style="left:50.30cqw"><i></i><span>1700–1760</span></div><div class="tk up" style="left:56.60cqw"><i></i><span>1703–1791</span></div><div class="tk dn" style="left:62.90cqw"><i></i><span>1792–1899</span></div><div class="tk up" style="left:69.20cqw"><i></i><span>1832–1951</span></div><div class="tk dn" style="left:75.50cqw"><i></i><span>1859–1936</span></div><div class="tk up" style="left:81.80cqw"><i></i><span>1885–1981</span></div><div class="tk dn" style="left:88.10cqw"><i></i><span>1900–1991</span></div><div class="tk up" style="left:94.40cqw"><i></i><span>1623–至今</span></div><div class="chrome">faith.localkin.ai</div><div class="cap"><span class="c-sp">一条从未断过的</span><span class="c-act">线</span><span class="c-up"></span></div></div><figcaption><div class="lab"><span>02 · 十五个时代，五十七位先贤，一条线</span><span>frame-02 · 10.3–17.1s</span></div><p class="note"><b>镜头往后拉。</b>从第一站「130」的特写一路拉远到整卷；「15」「57」跟着旁白出现，说到「一条从未断过的线」时，金线从左到右穿过十五站。</p><span class="chip">→ crossfade</span></figcaption></figure>
<div class="act">第二幕 · 沿卷而行</div>
<figure class="cell"><div class="frame" id="frame-03"><div class="scroll "><i class="edge t"></i><i class="edge b"></i></div><i class="bloom " style="left:61cqw;top:24.5cqw;width:58cqw;height:58cqw"></i><i class="thread"></i><div class="st" style="left:7cqw"><div class="yr">130</div><i class="dot"></i><div class="era">使徒时代</div><div class="nm">爱任纽<span class="nt">← 坡旅甲 ← 使徒约翰</span></div></div><div class="st" style="left:52cqw"><div class="yr">296–430</div><i class="dot now"></i><div class="era">教父</div><div class="nm now">亚他那修</div><div class="grp">金口约翰 · 奥古斯丁</div></div><div class="chrome">faith.localkin.ai</div><div class="cap"><span class="c-sp">亚他那修 为三位一体 </span><span class="c-act">独对全世界</span><span class="c-up"></span></div></div><figcaption><div class="lab"><span>03 · 使徒时代 · 教父</span><span>frame-03 · 17.1–30.3s</span></div><p class="note"><b>落回卷面，向右平移。</b>说到「爱任纽」时金墨写上，「坡旅甲、使徒约翰」是灰色小注（网站名单里没有他们，不算一站）；写上「亚他那修」时烛光移过去，金口约翰、奥古斯丁成组淡入。</p><span class="chip">→ push-slide ←</span></figcaption></figure>
