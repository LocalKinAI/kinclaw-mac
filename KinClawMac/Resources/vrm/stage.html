<!DOCTYPE html>
<!--
  The companion's body: a VRM character, rendered on a transparent canvas so
  the panel's glass — or, in the desktop pet window, the desktop — shows
  through.

  VRM is the format because it is the one the characters exist in: VRoid Hub
  publishes tens of thousands of them with clothes and hair as separate
  purchasable parts, and Desktop Mate and Grok's Ani are both VRM underneath.
  So "change her clothes" is a file, not a modelling job.

  Everything here is local: three.js, its glTF loader and @pixiv/three-vrm are
  vendored beside this file. A companion that needs a CDN is a companion that
  stops working on a plane.

  Swift drives it through `window.kin` — load, expression, mouth, look — and
  reads `window.kin.status()` to know what happened. Which is also how it is
  tested: no screenshot, just the numbers the scene reports.
-->
<html lang="zh">
<head>
<meta charset="utf-8">
<title>KinClaw companion stage</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; position: relative; }
  /* The place she is walking in. Drawn here rather than by the panel because
     its focus follows her: sharp while she is out in it, soft when she comes
     up to the lens — and only the page knows where she is. */
  #plate { position: absolute; inset: -3%; background: center / cover no-repeat;
           opacity: 0; transition: opacity 0.8s ease; will-change: filter, transform; }
  #err { position: absolute; inset: auto 12px 12px 12px; font: 12px -apple-system, sans-serif;
         color: #ffb4b4; white-space: pre-wrap; }
</style>
<script type="importmap">
{ "imports": { "three": "./three.module.js" } }
</script>
</head>
<body>
<div id="plate"></div>
<div id="err"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from './three-vrm.module.min.js';
import { VRMAnimationLoaderPlugin, createVRMAnimationClip, VRMLookAtQuaternionProxy }
  from './three-vrm-animation.module.min.js';

/// The five VRM standard mouth shapes, in the order a vowel chart puts them.
const VISEMES = ['aa', 'ih', 'ou', 'ee', 'oh'];

const state = {
  ready: false,
  model: '',
  error: '',
  expressions: [],
  mouth: 0,
  clip: null,
  clipEnds: 0,
  dance: false,
  lookProxy: null,
  visemes: { aa: 0, ih: 0, ou: 0, ee: 0, oh: 0 },
  viseme: '',
  talking: false,
  expression: '',
  frames: 0,
};

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearAlpha(0);
document.body.appendChild(renderer.domElement);

// Size from the element, not from the window: a host can report an inner size
// of 0 while laying the page out perfectly well (measured — one preview does),
// and a renderer sized from that draws nothing.
function measure() {
  const w = Math.max(renderer.domElement.clientWidth || document.documentElement.clientWidth
    || window.innerWidth, 1);
  const h = Math.max(renderer.domElement.clientHeight || document.documentElement.clientHeight
    || window.innerHeight, 1);
  return [w, h];
}

function resize() {
  const [w, h] = measure();
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.05, 40);
camera.position.set(0, 1.3, 2.2);

// Soft front light plus fill: a VRM's toon materials look flat under one lamp
// and blown out under a bright one.
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(0.6, 2.0, 2.2);
scene.add(key);
const hemi = new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.1);
scene.add(hemi);

const loader = new GLTFLoader();
loader.register((parser) => new VRMLoaderPlugin(parser));

let vrm = null;
/// What moves when she walks. The model hangs under it, so its own root keeps
/// the half-turn a VRM 0.x needs and the mixer keeps its root.
const actor = new THREE.Group();
scene.add(actor);
/// Something dark under her feet. A figure drawn over a photograph floats
/// until it casts something on the floor of it.
const shadow = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64, 64, 4, 64, 64, 62);
  grad.addColorStop(0, 'rgba(0,0,0,0.55)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.y = 0.004; m.visible = false; m.renderOrder = -1;
  actor.add(m);
  return m;
})();
const look = new THREE.Object3D();          // what the eyes follow
look.position.set(0, 1.35, 1.6);
scene.add(look);

/// Hang whatever swings from her hips — a skirt, a coat's hem, a tail — on
/// the hips themselves.
///
/// Spring bones are simulated in world space, which is right for hair: jump,
/// and it lifts. It is wrong for a skirt on somebody who crouches, kneels and
/// jumps on camera: the hips drop in a third of a second, the cloth has
/// inertia and stays where it was, and for those frames she is wearing it
/// round her waist. No pose fixes that. With the hips as the joints' centre
/// the cloth is simulated in the hips' own space — it still hangs by gravity,
/// still swings when she turns, is still pushed by her thighs — and simply
/// comes down with her. Hair and everything above the waist is left alone.
function anchorSkirt(v) {
  const hips = v.humanoid?.getRawBoneNode('hips'), spine = v.humanoid?.getRawBoneNode('spine');
  if (!hips || !v.springBoneManager) return 0;
  const under = (node, root) => { for (let n = node; n; n = n.parent) if (n === root) return true; return false; };
  let anchored = 0;
  state.skirt = [];
  for (const joint of v.springBoneManager.joints) {
    if (under(joint.bone, hips) && !(spine && under(joint.bone, spine))) {
      joint.center = hips; anchored++;
      state.skirt.push({ joint, stiffness: joint.settings.stiffness, gravity: joint.settings.gravityPower,
                         drag: joint.settings.dragForce });
    }
  }
  if (anchored) { v.springBoneManager.setInitState(); v.springBoneManager.reset(); }
  return anchored;
}

/// Let the skirt be cloth, by `amount` (0 as modelled … 1 limp).
///
/// A spring bone pulls back towards the direction it was modelled in, which
/// for a skirt is straight down. Standing, that is what keeps a hem in shape.
/// Seated it is a disaster: her thighs are where "straight down" used to be,
/// the colliders push the panels out of them, the spring pulls them back, and
/// the two settle with the front of the skirt standing up off her lap like a
/// fan. Cloth has no such spring. So while she sits the panels lose their
/// stiffness and gain weight, and lie over her thighs the way fabric does.
function drape(amount) {
  for (const { joint, stiffness, gravity, drag } of state.skirt ?? []) {
    joint.settings.stiffness = stiffness * (1 - amount) + 0.015 * amount;
    joint.settings.gravityPower = gravity + (Math.max(gravity, 1.1) - gravity) * amount;
    joint.settings.dragForce = drag + (Math.max(drag, 0.75) - drag) * amount;
  }
}

/// Arms down, elbows a little bent. A VRM's normalised humanoid rig rests in a
/// T-pose, which is why this is a fixed pose and not an offset: every model
/// starts from the same place, so one set of angles works for all of them.
function relax(v) {
  const set = (name, x, y, z) => {
    const bone = v.humanoid?.getNormalizedBoneNode(name);
    if (bone) bone.rotation.set(x, y, z);
  };
  set('leftUpperArm', 0.05, 0, -1.22);
  set('rightUpperArm', 0.05, 0, 1.22);
  set('leftLowerArm', 0, -0.25, -0.18);
  set('rightLowerArm', 0, 0.25, 0.18);
  set('leftHand', 0, 0, -0.1);
  set('rightHand', 0, 0, 0.1);
}

/// 'full' frames the whole character, head a little above centre — the
/// composition Desktop Mate uses, and the one that survives a narrow panel.
///
/// 'portrait' is waist up, and is for when she stands in one of her places.
/// The plates behind her are what is left of a waist-up photograph once the
/// person is taken out: a counter at elbow height, a horizon at the
/// shoulders. A whole figure in front of that is a doll held up to a
/// postcard; the same figure cropped where the photograph was cropped is
/// somebody standing in the room.
let framing = 'full';

/// Where she is in the place, and what she is up to in it.
///
/// Ground coordinates: x across the shot, z along it, the mark at the origin
/// — where she stands to talk, waist up to the fixed camera — and the place
/// itself stretching away down −z. Facing the camera is yaw 0.
const world = {
  horizon: 0.5,            // where the plate's horizon sits, 0 top … 1 bottom
  height: 1.5,             // hers, measured when the model loads
  yaw: 0,                  // which way she faces
  target: null,            // where she is walking to, {x, z, then}
  gait: 0,                 // 0 standing … 1 walking, eased
  phase: 0,                // where in the stride
  attend: true,            // wanted at the mark, facing the lens
  alive: true,             // wanders and plays when not wanted
  next: 4,                 // seconds until she next thinks of something
  act: null,               // a bit of play under way, {name, t, length}
  blur: 0,
  // How far into the place she goes. Nearer than `near` her feet are below
  // the frame; much past `far` she is a dot.
  near: 4.2, far: 10.5,
};

/// A point in the place: `depth` metres beyond the mark, `across` −1…1 of
/// the way to the edge of the shot at that depth.
function spot(depth, across) {
  const lens = THREE.MathUtils.degToRad(camera.fov);
  const away = camera.position.z + depth;
  const half = Math.tan(lens / 2) * away * camera.aspect;
  return { x: across * half * 0.72, z: -depth };
}

/// The pose language: what a motion she makes up for herself is written in.
///
/// Not bone angles. A language model asked for Euler angles on seventeen
/// joints produces arms through ribcages — it has no body to check them
/// against — and a rig that differs between VRM 0.x and 1.0 would need the
/// signs flipped besides. These are what a person would say instead: how
/// high an arm is raised, how far in front, how bent the elbow; how far the
/// head is turned; how deep the crouch. Each runs over a range the joint can
/// actually cover, so every combination of values is a pose a body can be in.
/// A motion is keyframes over these, and the stage does the rest.
const SLIDERS = {
  // arms, L and R: raise −0.2 hanging … 0.45 straight out … 1 overhead;
  // front 0 out to the side … 1 straight ahead … 1.4 across the body;
  // elbow 0 straight … 1 folded; twist −1 forearm down … 1 forearm up
  armRaiseL: [-0.2, 1], armRaiseR: [-0.2, 1], armFrontL: [-0.5, 1.4], armFrontR: [-0.5, 1.4],
  elbowL: [0, 1], elbowR: [0, 1], armTwistL: [-1, 1], armTwistR: [-1, 1],
  // head: turn + is to her left, nod + is down, tilt + is toward her left shoulder
  headTurn: [-1, 1], headNod: [-1, 1], headTilt: [-1, 1],
  // torso: lean + forward, twist + to her left, bend + to her left
  lean: [-0.6, 1], twist: [-1, 1], bend: [-1, 1],
  // legs: front + forward (a kick) − back; side out to the side; knee folded
  legFrontL: [-0.6, 1], legFrontR: [-0.6, 1], legSideL: [0, 1], legSideR: [0, 1],
  kneeL: [0, 1], kneeR: [0, 1],
  // whole body: crouch 0…1, jump 0…1 (height), turn ±1 is half a turn and
  // ±2 a full spin, sway − to her right … + to her left
  crouch: [0, 1], jump: [0, 1], turn: [-2, 2], sway: [-1, 1],
  // sit 0…1: seated — thighs forward, shins down, and a stool under her
  sit: [0, 1],
  // face, beyond the named expression: eyes 0 open … 1 shut, mouth 0…1 open
  eyes: [0, 1], mouth: [0, 1],
};
/// Hand shapes, as how far each finger is curled: thumb, index, middle, ring, little.
const HANDS = {
  relax: [0.2, 0.25, 0.3, 0.35, 0.4], open: [0, 0, 0, 0, 0], fist: [0.9, 1, 1, 1, 1],
  point: [0.8, 0, 1, 1, 1], peace: [0.9, 0, 0, 1, 1], thumb: [0, 1, 1, 1, 1], ok: [0.7, 0.75, 0, 0, 0],
};
const FACES = ['neutral', 'happy', 'sad', 'angry', 'relaxed', 'surprised'];

const ACTS = {
  wave: 2.6, stretch: 3.4, spin: 1.6, jump: 1.3, pick: 3.2, look: 3.6, dance: 5.5,
};

function frame(v) {
  // Measured at the mark, facing front: the box is in world space, and a
  // figure that is ten metres away when it is measured frames an empty shot.
  const [at, turn] = [actor.position.clone(), actor.rotation.y];
  actor.position.set(0, 0, 0); actor.rotation.y = 0; actor.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(v.scene);
  actor.position.copy(at); actor.rotation.y = turn;
  const height = Math.max(box.max.y - box.min.y, 0.5);
  const fov = THREE.MathUtils.degToRad(camera.fov);
  if (framing === 'scene') {
    // One fixed camera for the whole place, and she is what moves. It sits
    // where the portrait camera would — waist up when she stands at the
    // mark — so walking up to talk and wandering off are one continuous
    // shot. Wider than the portrait lens because the plates are: a place
    // photographed at 24mm and a figure rendered at 50mm do not share a
    // floor. `horizon` is where the plate's horizon sits (0 top … 1 bottom);
    // pitching the camera to match is what puts her feet on its ground.
    world.height = height;
    camera.fov = 40;
    const lens = THREE.MathUtils.degToRad(camera.fov);
    const span = height * 0.56;
    const distance = (span / 2) / Math.tan(lens / 2);
    camera.position.set(0, box.max.y + height * 0.05 - span / 2, distance);
    camera.rotation.set((world.horizon - 0.5) * lens, 0, 0);
    camera.updateProjectionMatrix();
    look.position.set(0, box.max.y - height * 0.08, distance * 0.7);
  } else if (framing === 'portrait') {
    const span = height * 0.52;                       // how much of her is in shot
    const centre = box.max.y + height * 0.05 - span / 2;   // a little air above the head
    const distance = (span / 2) / Math.tan(fov / 2);
    camera.position.set(0, centre, distance);
    camera.lookAt(0, centre, 0);
    look.position.set(0, box.max.y - height * 0.08, distance * 0.7);
  } else {
    const centre = (box.max.y + box.min.y) / 2;
    const distance = (height * 0.62) / Math.tan(fov / 2);
    camera.position.set(0, centre + height * 0.06, distance);
    camera.lookAt(0, centre, 0);
    look.position.set(0, box.max.y - height * 0.08, distance * 0.7);
  }
  look.userData.base = look.position.y;
}

const kin = {
  /// Load a .vrm. Resolves to the status, so Swift can tell a model that
  /// loaded from one that failed without polling.
  async load(url) {
    state.error = '';
    try {
      const gltf = await loader.loadAsync(url);
      const next = gltf.userData.vrm;
      if (!next) throw new Error('这个文件里没有 VRM 数据');
      if (vrm) {
        actor.remove(vrm.scene);
        VRMUtils.deepDispose(vrm.scene);
      }
      VRMUtils.removeUnnecessaryVertices(gltf.scene);
      VRMUtils.combineSkeletons(gltf.scene);
      // VRM 0.x characters face -Z and 1.0 ones face +Z, so a 0.x model
      // loaded as-is stands with its back to you. This rotates the old ones
      // into the new convention; on a 1.0 model it does nothing.
      VRMUtils.rotateVRM0(next);
      next.scene.traverse((o) => { o.frustumCulled = false; });
      actor.position.set(0, 0, 0); actor.rotation.set(0, 0, 0);
      actor.add(next.scene);
      vrm = next;
      mixer = null;                      // the old one animated the old model
      state.anchored = anchorSkirt(vrm);
      originals.clear(); state.outfit = null;
      vrm.lookAt && (vrm.lookAt.target = look);
      relax(vrm);
      // The hips bone rests at hip height, not at zero: every bounce, crouch
      // and jump is an offset from here. Written straight into position.y,
      // a two-centimetre bob puts her waist on the floor.
      const hipsBone = vrm.humanoid?.getNormalizedBoneNode('hips');
      state.hipsRest = hipsBone ? hipsBone.position.y : 0;
      state.bones = Object.keys(vrm.humanoid?.humanBones ?? {});
      // Her legs, for `fold`: measured in the rest pose, hips to knee to ankle.
      {
        const at = (name) => { const b = vrm.humanoid?.getNormalizedBoneNode(name);
                               return b ? b.getWorldPosition(new THREE.Vector3()) : null; };
        vrm.scene.updateMatrixWorld(true);
        const [hip, knee, ankle] = [at('leftUpperLeg'), at('leftLowerLeg'), at('leftFoot')];
        const hipsAt = at('hips');
        if (hip && knee && ankle && hipsAt) {
          state.legs = { thigh: hip.distanceTo(knee), shin: knee.distanceTo(ankle), ankle: ankle.y,
                         hips: ankle.y + knee.distanceTo(ankle) + hip.distanceTo(knee) };
        }
      }
      frame(vrm);
      state.ready = true;
      state.model = url;
      state.expressions = vrm.expressionManager
        ? vrm.expressionManager.expressions.map((e) => e.expressionName)
        : [];
      state.faces = Object.fromEntries(state.expressions.map((n) => [n.toLowerCase(), n]));
      return this.status();
    } catch (e) {
      state.error = String(e && e.message ? e.message : e);
      state.ready = false;
      document.getElementById('err').textContent = state.error;
      return this.status();
    }
  },

  /// One of the VRM standard expressions — happy, sad, angry, relaxed,
  /// surprised — at a weight. Anything the model does not have is ignored
  /// rather than treated as an error: expression sets vary per model.
  expression(name, weight = 1) {
    if (!vrm?.expressionManager) return false;
    face.mood = name ? { [name]: weight } : {};
    face.lids = 0;
    feel.now = null; feel.name = '';
    state.expression = name;
    return true;
  },

  // ── What she is wearing ────────────────────────────────────────────────
  //
  // A VRM's clothes are a mesh with a painted texture, and the mesh cannot be
  // changed from here. The paint can. The edit model will repaint a flat UV
  // atlas from a description — a red dress with lace, a sailor uniform, black
  // with purple ribbons — and leave every island exactly where it was, so the
  // result maps straight back onto her. The cut stays; colour, fabric and
  // pattern are free.

  /// The materials that are clothes, and how big their textures are.
  wardrobe() {
    return clothes().map(({ name, map }) => ({ name, width: map.image?.width ?? 0, height: map.image?.height ?? 0 }));
  },

  /// One clothing texture as a PNG data URL, flattened on grey and no larger
  /// than `max` on a side: what goes to the edit model.
  texture(name, max = 1024) {
    const item = clothes().find((c) => c.name === name);
    const image = (item && originals.get(item.name)?.image) || item?.map.image;
    if (!image) return null;
    const scale = Math.min(1, max / Math.max(image.width, image.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(image.width * scale); canvas.height = Math.round(image.height * scale);
    const g = canvas.getContext('2d');
    g.fillStyle = '#808080'; g.fillRect(0, 0, canvas.width, canvas.height);
    g.drawImage(image, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/png');
  },

  /// Whether a repaint kept the atlas's layout: `{ ok, spread }`.
  ///
  /// The edit model usually repaints in place. Sometimes it does not — asked
  /// about boots while looking at a dress it painted boots into the dress,
  /// and shown a small atlas it could not read it drew a fashion plate
  /// instead — and either of those, mapped back onto her, is rubbish. What a
  /// faithful repaint always keeps is the *empty* part of the atlas: nothing
  /// was there, so nothing should be there now, whatever flat colour it came
  /// back as. So the pixels that were transparent in the original are
  /// measured in the repaint, and if they are no longer one flat colour,
  /// something has been drawn where there was nothing.
  async fits(name, url) {
    const item = clothes().find((c) => c.name === name);
    const original = (item && originals.get(name)) || item?.map;
    if (!original?.image) return { ok: false, spread: -1 };
    const painted = await new Promise((ok) => {
      const img = new Image(); img.onload = () => ok(img); img.onerror = () => ok(null);
      img.src = url + (url.includes('?') ? '&' : '?') + 'v=' + Date.now();
    });
    if (!painted) return { ok: false, spread: -1 };
    const n = 160, read = (image) => {
      const c = document.createElement('canvas'); c.width = c.height = n;
      const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(image, 0, 0, n, n);
      return g.getImageData(0, 0, n, n).data;
    };
    const was = read(original.image), now = read(painted);
    const empty = [];
    for (let i = 0; i < n * n; i++) if (was[i * 4 + 3] < 20) empty.push(i);
    if (empty.length < n * n * 0.04) return { ok: true, spread: 0 };        // no empty part to judge by
    const mean = [0, 0, 0];
    for (const i of empty) for (let k = 0; k < 3; k++) mean[k] += now[i * 4 + k] / empty.length;
    let spread = 0;
    for (const i of empty) for (let k = 0; k < 3; k++) spread += Math.abs(now[i * 4 + k] - mean[k]) / (empty.length * 3);
    // Measured: a faithful repaint 2.9, a dress with boots painted into its
    // empty corner 19.4, a fashion plate 89.9.
    return { ok: spread < 10, spread: +spread.toFixed(1) };
  },

  /// The original texture recoloured: its own shading, in another colour, as
  /// a PNG data URL. For the pieces the edit model cannot repaint — a small
  /// atlas of shoe parts reads to it as nothing in particular — this is what
  /// "black boots" can still mean, and it cannot get the layout wrong because
  /// it never touches it.
  tinted(name, rgb) {
    const item = clothes().find((c) => c.name === name);
    const image = (item && originals.get(name)?.image) || item?.map.image;
    if (!image || !Array.isArray(rgb)) return null;
    const canvas = document.createElement('canvas');
    canvas.width = image.width; canvas.height = image.height;
    const g = canvas.getContext('2d', { willReadFrequently: true });
    g.drawImage(image, 0, 0);
    const data = g.getImageData(0, 0, canvas.width, canvas.height), px = data.data;
    // Light and shade come from the original; how dark the colour is decides
    // how much of the highlights survive, or black leather comes out grey.
    const depth = (0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2]) / 255;
    for (let i = 0; i < px.length; i += 4) {
      const luma = (0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2]) / 255;
      const shade = 0.35 + 0.95 * luma, shine = Math.max(0, luma - 0.75) * 2.2 * (1 - depth * 0.6);
      for (let k = 0; k < 3; k++) px[i + k] = Math.min(255, rgb[k] * shade + 255 * shine);
    }
    g.putImageData(data, 0, 0);
    return canvas.toDataURL('image/png');
  },

  /// Put repainted textures on: { materialName: url }. Each takes the
  /// original's alpha — the repaint comes back opaque, and the lace along a
  /// hem is cut out of the texture by exactly that alpha.
  async dress(paints) {
    const done = [];
    for (const item of clothes()) {
      const url = paints?.[item.name];
      if (!url) continue;
      if (!originals.has(item.name)) originals.set(item.name, item.map);
      const original = originals.get(item.name);
      try {
        const painted = await new Promise((ok, bad) => {
          const img = new Image(); img.onload = () => ok(img); img.onerror = () => bad(new Error('load ' + url));
          img.src = url + (url.includes('?') ? '&' : '?') + 'v=' + Date.now();
        });
        const canvas = document.createElement('canvas');
        canvas.width = original.image.width; canvas.height = original.image.height;
        const g = canvas.getContext('2d');
        g.drawImage(painted, 0, 0, canvas.width, canvas.height);
        g.globalCompositeOperation = 'destination-in';

  status() {
    return {

      where: { x: +actor.position.x.toFixed(2), depth: +(-actor.position.z).toFixed(2),

// Blink, breath, and a mouth that follows the voice. Small amounts on purpose:
// a character that moves a lot reads as a toy, and this one sits next to a
// conversation for an hour.
let mixer = null;

motionLoader.register((parser) => new VRMAnimationLoaderPlugin(parser));

const clock = new THREE.Clock();

///
/// Not a deep squat. Thighs lifted towards the lens take the front of a skirt
/// up with them, and a companion who flashes whoever is talking to her every
/// time she picks something up is not one anybody can leave on screen. So it
/// is what somebody in a skirt does: down to half way is an athletic bend —
/// knees forward a little, feet flat, the hem still where it was — and past
/// that she goes on down to her knees, thighs back under her and the skirt
/// hanging straight in front. Knees together throughout.
function fold(c) {
  const bend = Math.min(c, 0.5) / 0.5;
  const k = ease(Math.max(0, c - 0.5) / 0.5);
  const hip = 0.4 * bend * (1 - k) + 0.06 * k;          // thighs forward, then back under her
  const knee = 0.8 * bend * (1 - k) + 1.62 * k;
  // How far the hips come down is geometry, not a guess at her proportions:
  // standing on bent legs the feet stay on the floor, and kneeling it is the
  // knees that are on it. Measured off her own skeleton when she loads.
  const { thigh, shin, ankle, hips } = state.legs ?? { thigh: 0.4, shin: 0.4, ankle: 0.08, hips: 0.88 };
  const standing = ankle + shin * Math.cos(knee - hip) + thigh * Math.cos(hip);
  const kneeling = ankle * 0.2 + thigh * Math.cos(hip);      // the kneecap is on the floor, not the joint's centre
  return {
    hip, knee,
    foot: 0.4 * bend * (1 - k) - 0.95 * k,              // flat on the floor, then toes pointed back
    drop: (hips - (standing * (1 - k) + kneeling * k)) / Math.max(world.height, 0.5),   // of her height
    together: 0.05 * bend + 0.03 * k,
  };
}

  for (let i = 1; i < track.length; i++) {

/// Lay a composed motion over the body the idle has just posed. It owns
/// every joint it names, eased in over a third of a second and out over
/// half, so it starts from wherever she was and ends where she would have
/// been anyway.
/// Lay a pose — values for the sliders in SLIDERS — over the body the idle
/// has just posed, by `w`. Returns how far it turns her.
///
/// It owns only what it names. A motion that says nothing about her legs
/// leaves them to whatever else is going on, a mood that only tilts her head
/// leaves her arms swinging as they were; `owns(slider)` is how it says which.
/// Composed motions, moods and anything else written in the pose language
/// all come through here, so they agree about what a raised arm is.
function layPose(v, owns, w, dt, bone, hands) {
  const old = vrm.meta?.metaVersion === '0';
  const sgn = old ? 1 : -1;                    // see liveInPlace: the 0.x rig is mirrored
  const h = world.height;

  const euler = (name, x, y, z) => pose(name, _q.setFromEuler(_e.set(x, y, z, 'XYZ')));

  // Arms. Where the arm points is two angles — how high, how far in front —
  // and the joint takes the shortest turn from its rest (straight out to the
  // side) to there. Hanging, straight ahead, overhead and across the chest
  // are all the same kind of thing that way, and no value of either slider
  // is a direction an arm cannot point.
  for (const [S, side] of [['L', 1], ['R', -1]]) {
    const limb = side > 0 ? 'left' : 'right';
    if (any('armRaise' + S, 'armFront' + S, 'elbow' + S, 'armTwist' + S)) {
      const out = (old ? -1 : 1) * side;                     // which way this arm's rest points, along x
      const front = old ? -1 : 1;                            // which way she faces, along z
      const up = (v('armRaise' + S) - 0.45) / 0.55 * (Math.PI / 2) * (v('armRaise' + S) < 0.45 ? 0.9 : 1);
      const round = v('armFront' + S) * (Math.PI / 2);

      _to.set(out * Math.cos(up) * Math.cos(round), Math.sin(up), front * Math.cos(up) * Math.sin(round)).normalize();
      _q.setFromUnitVectors(_from, _to);
      _q2.setFromAxisAngle(_from.set(1, 0, 0), sgn * v('armTwist' + S) * 1.3);
      pose(limb + 'UpperArm', _q.multiply(_q2));

    const shape = hands?.shape(S);
    if (shape) {
      const now = hands.now[S];
      ['Thumb', 'Index', 'Middle', 'Ring', 'Little'].forEach((finger, i) => {
        now[i] += (shape[i] - now[i]) * Math.min(1, dt * 12);
        const parts = finger === 'Thumb' ? ['Metacarpal', 'Proximal', 'Distal'] : ['Proximal', 'Intermediate', 'Distal'];
        for (const part of parts) {

    // a seat, whatever her proportions. Turned three-quarters to the lens:
    // thighs pointed straight at it are the squat's problem once more.
    const sit = ease(Math.max(0, Math.min(1, v('sit'))));
    const thigh = state.legs?.thigh ?? h * 0.25;
    for (const [S, side] of [['L', 1], ['R', -1]]) {
      const leg = side > 0 ? 'left' : 'right';
      euler(leg + 'UpperLeg', sgn * (v('legFront' + S) * 1.3 + legs.hip + 1.45 * sit), 0,
            side * sgn * (legs.together + 0.04 * sit - v('legSide' + S) * 0.55));
      euler(leg + 'LowerLeg', -sgn * Math.min(2.3, v('knee' + S) * 2.2 + legs.knee + 1.5 * sit), 0, 0);
      euler(leg + 'Foot', sgn * legs.foot, 0, 0);
    }
    state.seated = Math.max(state.seated || 0, sit * w);
    turn += 0.62 * sit;
    const hips = bone('hips');
    if (hips) {
      const rest = state.hipsRest;
      hips.position.y += ((rest - h * legs.drop - thigh * 0.97 * sit + h * 0.24 * v('jump')) - hips.position.y) * w;
      hips.position.x += (v('sway') * h * 0.08 * (old ? -1 : 1) - hips.position.x) * w;
    }
    // A high kick towards the lens is the squat's problem again, so she
    // turns side-on for it — which is also how a kick is best seen.
    const kickL = v('legFrontL'), kickR = v('legFrontR');
    const kick = Math.max(kickL, kickR);
    const aside = Math.max(0, Math.min(1, (kick - 0.4) / 0.35)) * (kickL >= kickR ? -1 : 1);
    state.aside = (state.aside || 0) + (aside - (state.aside || 0)) * Math.min(1, dt * 6);
    turn += state.aside * 1.3;
  }
  if (owns('turn')) turn += v('turn') * Math.PI;
  return turn * w;
}

/// A motion she made up, laid over everything else: eased in over a third of
/// a second and out over half, so it starts from wherever she was and ends
/// where she would have been anyway.
function applyComposed(dt, bone) {
  const c = state.composed;
  const total = c.length * c.loops;
  c.t += dt;
  const closing = c.t >= total;
  c.w = Math.max(0, Math.min(1, c.w + (closing ? -dt / 0.5 : dt / 0.35)));
  if (closing && c.w <= 0) { state.composed = null; state.turn = 0; face.over = null; return; }
  const at = closing ? c.length : (c.t % c.length || (c.t > 0 ? c.length : 0));
  const v = (name) => sample(c.tracks[name], at);
  state.turn = layPose(v, (name) => !!c.tracks[name], c.w, dt, bone, {
    now: c.fingers, shape: (S) => (c.tracks['hand' + S] ? HANDS[latest(c.tracks['hand' + S], at)] ?? HANDS.relax : null),
  });
  // The face it asks for sits over the mood's for as long as it lasts.
  const named = latest(c.tracks.face, at);
  const wink = latest(c.tracks.wink, at);
  face.over = { w: c.w, emotion: named ? { [named]: 1 } : null,
                lids: v('eyes'), left: wink === 'left' ? 1 : 0, right: wink === 'right' ? 1 : 0 };
  if (c.tracks.mouth) state.mouth = Math.max(state.mouth, v('mouth') * c.w);
}

// A mood used to be one of five face presets, switched. Nobody's face works
// like that, and nobody's feelings stop at the neck: tired is a head that
// hangs and lids half way down, and a yawn every so often; worried is hands
// that have found each other. So a mood is a face (a blend, eased), a way of
// standing (a pose, laid lightly over the idle), how much she moves, and
// something she does now and then.

/// Her clothes: materials grouped by name (a toon material and its outline
/// share one), with the texture they are painted from. VRoid marks cloth in
/// the material's name; for anything else it is whatever is not face, skin,
/// eyes or hair.
const originals = new Map();
function clothes() {
  if (!vrm) return [];
  const found = new Map();
  vrm.scene.traverse((o) => {
    for (const material of [].concat(o.material ?? [])) {
      if (!material?.map?.image) continue;
      const name = String(material.name || '').replace(/\s*\(Outline\)$/i, '');
      const cloth = /_CLOTH\b|cloth|tops|bottoms|onepiece|shoes|dress|skirt|shirt|jacket|coat|wear/i.test(name);
      const body = /FACE|SKIN|EYE|HAIR|body|mouth|brow|lash|iris|highlight/i.test(name);
      if (!cloth || (body && !/_CLOTH\b/i.test(name))) continue;
      if (!found.has(name)) found.set(name, { name, map: material.map, materials: [] });
      found.get(name).materials.push(material);
    }
  });
  return [...found.values()];
}

const held = { name: null, object: null, w: 0, next: 8, fingers: { L: [...HANDS.relax], R: [...HANDS.relax] } };
const _p0 = new THREE.Vector3(), _p1 = new THREE.Vector3(), _p2 = new THREE.Vector3();

/// A stool, for when she sits with nothing in the photograph to sit on.
const stool = (() => {

  const top = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.05, 28), paint(0xd8b98a));

/// The arm that is carrying something, and the seat she has taken: two more
/// poses laid over the idle, under anything she is doing on purpose.
function applyCarryAndSeat(dt, bone) {
  const busy = (framing === 'scene' ? world.gait : 0) > 0.2;
  const carry = held.name ? CARRY[held.name] : null;
  held.w = Math.max(0, Math.min(1, held.w + (carry ? dt / 0.5 : -dt / 0.4)));
  if (carry && held.w > 0) {
    layPose((n) => carry.pose[n] ?? 0, (n) => carry.pose[n] !== undefined, held.w, dt, bone,
            { now: held.fingers, shape: (S) => (S === 'R' ? HANDS[carry.hand] : null) });
    if (carry.often && !state.composed && !world.act && !busy) {
      held.next -= dt;
      if (held.next <= 0) {
        const [act, lo, hi] = carry.often;
        held.next = lo + Math.random() * (hi - lo);
        kin.compose({ name: act, frames: CARRY_ACTS[act] }, false);
      }
    }
  }
  // Seated for as long as she is asked to be; walking anywhere stands her up.
  if (busy && world.seat) world.seat = null;
  const want = world.seat === 'stool' ? 1 : 0, kneel = world.seat === 'floor' ? 1 : 0;
  world.sat = (world.sat ?? 0) + (want - (world.sat ?? 0)) * Math.min(1, dt * 2.2);
  world.knelt = (world.knelt ?? 0) + (kneel - (world.knelt ?? 0)) * Math.min(1, dt * 2.2);
  if (world.sat > 0.01 || world.knelt > 0.01) {
    const values = { sit: world.sat, crouch: world.knelt, lean: 0.06 * world.knelt };
    if (!carry) Object.assign(values, { armFrontL: 0.62, armFrontR: 0.62, armRaiseL: 0.1, armRaiseR: 0.1, elbowL: 0.36, elbowR: 0.36 });
    state.seatTurn = layPose((n) => values[n] ?? 0, (n) => values[n] !== undefined, 1, dt, bone, null);
  } else state.seatTurn = 0;
}

/// Where the thing in her hand is, once the frame's pose is final.
function placeProps() {
  const sat = state.seated || 0;
  stool.visible = sat > 0.05;
  if (stool.visible) {
    const seatHeight = (state.legs ? state.legs.ankle + state.legs.shin : world.height * 0.3) * 0.98;
    stool.position.set(0, seatHeight, -0.02);
    stool.scale.setScalar(Math.min(1, sat * 1.5));
    for (const leg of stool.children) if (leg.name === 'leg') { leg.scale.y = seatHeight - 0.05; leg.position.y = -0.05 - (seatHeight - 0.05) / 2; }
  }
  drape(Math.min(1, sat * 1.6));
  state.seated = 0;                                   // said again next frame by whoever is sitting
  if (!held.object) return;
  held.object.visible = held.w > 0.3;
  const hand = vrm.humanoid?.getRawBoneNode('rightHand'), fore = vrm.humanoid?.getRawBoneNode('rightLowerArm');
  const head = vrm.humanoid?.getRawBoneNode('head');
  if (!hand || !fore) return;
  hand.getWorldPosition(_p1); fore.getWorldPosition(_p0);
  const along = _p2.copy(_p1).sub(_p0).normalize();
  const size = world.height / 1.55;
  held.object.position.copy(_p1).addScaledVector(along, 0.075 * size);
  held.object.scale.setScalar(size * (held.name === 'mug' ? 0.76 : 1));
  const carry = CARRY[held.name];
  if (carry.turn === 'face' && head) {
    head.getWorldPosition(_p0); _p0.y += 0.06 * size;
    held.object.lookAt(_p0);                            // a page, a screen: turned to her eyes
    held.object.position.y += 0.03 * size;
  } else {
    held.object.rotation.set(0, actor.rotation.y, 0);   // a mug, an umbrella: upright whatever the wrist does
    if (held.name === 'mug') held.object.position.y += 0.035 * size;
  }

const face = { mood: {}, lids: 0, over: null, wink: 0, winkIn: 12 };
const feel = { name: '', now: null, w: 0, next: 0, last: {} };

/// The posture and the habits of whatever she is feeling.
function applyMood(dt, t, bone) {
  const m = feel.now;
  // Walking, playing and motions of her own all outrank a way of standing.
  const busy = (framing === 'scene' ? world.gait : 0) > 0.2 || world.act || state.composed || state.dance;
  feel.w = Math.max(0, Math.min(1, feel.w + (m && !busy ? dt / 0.7 : -dt / 0.4)));
  if (!m || feel.w <= 0) return;
  const values = { ...m.pose };
  if (m.fidget) {                                   // hands that will not keep still
    values.elbow = (values.elbow ?? 0) + 0.035 * Math.sin(t * 4.3) + 0.02 * Math.sin(t * 7.1);
    values.armFront = (values.armFront ?? 0) + 0.02 * Math.sin(t * 3.1);
  }
  const both = (name) => values[name] ?? values[name.slice(0, -1)];        // "armRaise" is both arms
  layPose((n) => both(n) ?? 0, (n) => both(n) !== undefined, feel.w, dt, bone, null);

  // Something she does now and then.
  if (m.often && !busy) {
    feel.next -= dt;
    if (feel.next <= 0) {
      const [act, lo, hi] = m.often;
      feel.next = lo + Math.random() * (hi - lo);
      kin.compose({ name: act, frames: MOOD_ACTS[act] }, false);
    }
  }
}

/// Ease every expression towards what the mood — or a motion, over it — asks.
function mixFace(dt) {
  const em = vrm.expressionManager;
  if (!em) return;
  const over = face.over, ow = over?.w ?? 0;
  const want = {};
  for (const [name, weight] of Object.entries(face.mood)) want[name] = weight * (over?.emotion ? 1 - ow : 1);
  for (const [name, weight] of Object.entries(over?.emotion ?? {})) want[name] = (want[name] ?? 0) + weight * ow;
  for (const name of ['happy', 'sad', 'angry', 'relaxed', 'surprised']) {
    const actual = spelled(name);
    if (!actual) continue;
    const now = em.getValue(actual) ?? 0;
    em.setValue(actual, now + ((want[name] ?? 0) - now) * Math.min(1, dt * 5));
  }
  // A wink, once in a while, when she is in the mood for one.
  if (feel.now?.wink && !over) {
    face.winkIn -= dt;
    if (face.winkIn <= 0) { face.wink = 0.45; face.winkIn = 14 + Math.random() * 22; }
  }
  face.wink = Math.max(0, face.wink - dt);
  const pulse = face.wink > 0 ? Math.sin(face.wink / 0.45 * Math.PI) : 0;
  const lids = Math.max(face.lids * (1 - ow), (over?.lids ?? 0) * ow);
  const set = (name, value) => { const actual = spelled(name); if (actual) em.setValue(actual, value); };
  set('blinkLeft', Math.max(over?.left ? ow : 0, pulse));
  set('blinkRight', over?.right ? ow : 0);
  state.lids = lids;                          // the blink adds itself on top of this
}

const turnTo = (from, to) => {
  let d = (to - from) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return d;
};
const ease = (u) => u * u * (3 - 2 * u);
/// 0 → 1 → 0 over an act, with flat shoulders so a pose is held, not touched.
const hold = (u, edge = 0.25) => ease(Math.min(1, Math.min(u, 1 - u) / edge));

/// Her life in a place: deciding where to go, going there, and what she gets
/// up to when she arrives. Runs after the standing idle has posed her, so
/// everything here is laid over a body that is already breathing.
function liveInPlace(dt, t, bone) {
  // A VRM 0.x is modelled facing −Z and a 1.0 facing +Z, and the normalised
  // rig keeps that: the same rotation swings a leg forward on one and back
  // on the other. `fwd` is the sign of an x-rotation that carries a hanging
  // limb forward; `down` the sign of the z-rotation that lowers the left arm.
  const old = vrm.meta?.metaVersion === '0';
  const fwd = old ? 1 : -1, down = old ? 1 : -1;
  const h = world.height;

  // ── thinking ────────────────────────────────────────────────────────
  if (!world.target && !world.act && !state.composed) {
    const fromMark = Math.hypot(actor.position.x, actor.position.z);
    if (world.attend) {
      if (fromMark > 0.12 && performance.now() > (world.hold || 0)) kin.walk(0, 0, 'face', false);
    } else if (world.alive) {
      world.next -= dt;
      if (world.next <= 0) {
        world.next = 4 + Math.random() * 7;
        const pick = (list) => list[Math.floor(Math.random() * list.length)];
        if (fromMark < 1 || Math.random() < 0.5) {
          // Mostly the near half of the place: far away she is small, and a
          // companion who spends the evening as a dot is not company.
          const reach = Math.random() < 0.75 ? 0.5 : 1;
          const depth = world.near + Math.random() * (world.far - world.near) * reach;
          kin.walk(depth, Math.random() * 2 - 1,
                   pick(['face', 'face', 'look', 'wave', 'stretch', 'pick', 'spin', 'jump', 'dance']), false);
        } else {
          kin.play(pick(Object.keys(ACTS)), false);
        }
      }
    }
  }

  // ── going ───────────────────────────────────────────────────────────
  let want = Math.atan2(camera.position.x - actor.position.x, camera.position.z - actor.position.z);
  let moving = false, speed = 0;
  if (world.target) {
    const dx = world.target.x - actor.position.x, dz = world.target.z - actor.position.z;
    const left = Math.hypot(dx, dz);
    if (left < 0.06) {
      const then = world.target.then;
      world.target = null;
      if (ACTS[then]) kin.play(then, false);
    } else {
      want = Math.atan2(dx, dz);
      // Turn first, then go: setting off sideways is how a game character
      // moves, not a person.
      if (Math.abs(turnTo(world.yaw, want)) < 0.6) {
        moving = true;
        speed = 1.1 * world.gait * Math.min(1, left / 0.5 + 0.2);
        actor.position.x += Math.sin(world.yaw) * speed * dt;
        actor.position.z += Math.cos(world.yaw) * speed * dt;
      }
    }
  }
  const step = turnTo(world.yaw, want);
  world.yaw += Math.sign(step) * Math.min(Math.abs(step), 3.4 * dt);
  world.gait += ((moving ? 1 : 0) - world.gait) * Math.min(1, dt * 5);

  // ── the stride ──────────────────────────────────────────────────────
  // Cadence comes from distance covered, not from the clock: a stride is as
  // long as the legs make it, so the feet stay where they were put instead
  // of skating over the floor of the photograph.
  const g = world.gait;
  const A = 0.46, legLength = h * 0.47;
  world.phase += (speed / (4 * legLength * Math.sin(A))) * Math.PI * 2 * dt;
  const L = Math.sin(world.phase), lift = Math.cos(world.phase);
  const limbs = {
    leftUpperLeg:  fwd * A * L * g,   rightUpperLeg:  -fwd * A * L * g,
    leftLowerLeg: -fwd * 1.05 * Math.max(0, lift) * g,
    rightLowerLeg: -fwd * 1.05 * Math.max(0, -lift) * g,
    leftFoot:  fwd * 0.25 * Math.max(0, lift) * g,
    rightFoot: fwd * 0.25 * Math.max(0, -lift) * g,
  };
  for (const [name, x] of Object.entries(limbs)) { const b = bone(name); if (b) b.rotation.set(x, 0, 0); }
  const hips = bone('hips');
  if (hips) {
    hips.position.y = state.hipsRest + -0.03 * h * L * L * g;
    hips.rotation.y = -0.13 * L * g;
    hips.rotation.x = -fwd * 0.04 * g;                // leaning into it a little
  }
  const spine = bone('spine'); if (spine) spine.rotation.y = 0.1 * L * g;
  for (const [name, side] of [['leftUpperArm', 1], ['rightUpperArm', -1]]) {
    const b = bone(name);
    if (b) b.rotation.x = b.rotation.x * (1 - g) + (-fwd * 0.5 * L * side) * g;
  }
  for (const [name, side] of [['leftLowerArm', 1], ['rightLowerArm', -1]]) {
    const b = bone(name);
    if (b) b.rotation.y = -side * (0.3 + 0.25 * Math.max(0, -L * side)) * g;
  }

  // ── playing ─────────────────────────────────────────────────────────
  let spin = 0;
  state.dance = false;
  if (world.act) {
    const act = world.act;
    act.t += dt;
    const u = Math.min(1, act.t / act.length), k = hold(u);
    const arm = (name, side, z, x = 0) => {
      const b = bone(name);
      if (b) { b.rotation.z = b.rotation.z * (1 - k) + down * side * z * k; b.rotation.x = b.rotation.x * (1 - k) + x * k; }
    };
    const crouch = (deep) => {
      const legs = fold(deep);
      for (const [side, s] of [['left', 1], ['right', -1]]) {
        const up = bone(side + 'UpperLeg'), low = bone(side + 'LowerLeg'), foot = bone(side + 'Foot');
        if (up) up.rotation.set(fwd * legs.hip, 0, s * fwd * legs.together);
        if (low) low.rotation.x = -fwd * legs.knee;
        if (foot) foot.rotation.x = fwd * legs.foot;
      }
      if (hips) hips.position.y = state.hipsRest - h * legs.drop;
    };
    const chest = bone('chest') ?? bone('spine'), head = bone('head');
    if (act.name === 'wave') {
      arm('rightUpperArm', -1, -0.85);
      const fore = bone('rightLowerArm');
      if (fore) fore.rotation.z = fore.rotation.z * (1 - k) + down * -1 * (-1.1 + 0.4 * Math.sin(act.t * 9)) * k;
      if (head) head.rotation.z += 0.08 * k;
    } else if (act.name === 'stretch') {
      arm('leftUpperArm', 1, -1.35); arm('rightUpperArm', -1, -1.35);
      if (chest) chest.rotation.x += fwd * 0.16 * k;
      if (head) head.rotation.x += fwd * 0.22 * k;
      for (const side of ['left', 'right']) { const f = bone(side + 'Foot'); if (f) f.rotation.x = -fwd * 0.3 * k; }
      if (hips) hips.position.y = state.hipsRest + 0.035 * h * k;
    } else if (act.name === 'spin') {
      spin = Math.PI * 2 * ease(u);
      arm('leftUpperArm', 1, 0.55); arm('rightUpperArm', -1, 0.55);
      if (hips) hips.position.y = state.hipsRest + 0.05 * h * Math.sin(u * Math.PI);
    } else if (act.name === 'jump') {
      const air = u > 0.32 && u < 0.72 ? Math.sin((u - 0.32) / 0.4 * Math.PI) : 0;
      crouch((u <= 0.32 ? ease(u / 0.32) : u >= 0.72 ? 1 - ease((u - 0.72) / 0.28) : 0) * 0.42);
      if (hips && air > 0) hips.position.y = state.hipsRest + 0.26 * h * air;
      arm('leftUpperArm', 1, 1.2 - 2.3 * air); arm('rightUpperArm', -1, 1.2 - 2.3 * air);
    } else if (act.name === 'pick') {
      // Down to something on the ground, a look at it, and up again.
      crouch(k * 0.92);
      if (chest) chest.rotation.x -= fwd * 0.35 * k;
      if (head) head.rotation.x -= fwd * 0.3 * k;
      arm('rightUpperArm', -1, 0.9, fwd * 0.9 * k);
    } else if (act.name === 'look') {
      const sweep = Math.sin(u * Math.PI * 2) * k;
      if (head) head.rotation.y = 0.75 * sweep;
      if (chest) chest.rotation.y = 0.3 * sweep;
      arm('rightUpperArm', -1, -0.55, fwd * 0.5 * k);        // a hand up against the light
      const fore = bone('rightLowerArm'); if (fore) fore.rotation.y = 1.5 * k;
    } else if (act.name === 'dance') {
      state.dance = true;
    }
    if (u >= 1) { world.act = null; world.next = 2 + Math.random() * 5; }
  }

  actor.rotation.y = world.yaw + spin + (state.turn || 0) + (state.seatTurn || 0);

  // ── eyes, shadow, focus ─────────────────────────────────────────────
  // Where she is going while she walks, the lens when she is not.
  const eye = h * 0.92;
  if (g > 0.4) {
    look.position.set(actor.position.x + Math.sin(world.yaw) * 3, eye, actor.position.z + Math.cos(world.yaw) * 3);
  } else if (!glance) {
    look.position.set(camera.position.x, camera.position.y, camera.position.z);
  }
  const rise = hips ? Math.max(0, hips.position.y - state.hipsRest) / h : 0;      // the shadow thins as she leaves the ground
  shadow.scale.set(h * 0.5 * (1 - rise), h * 0.26 * (1 - rise), 1);
  // Out in the place it is sharp around her; at the lens it falls away behind
  // her, as it would for a camera focused a metre off.
  const depth = -actor.position.z;
  const blur = Math.max(0, 5.5 - depth * 1.6);
  if (Math.abs(blur - world.blur) > 0.05) {
    world.blur += (blur - world.blur) * Math.min(1, dt * 3);
    document.getElementById('plate').style.filter = `blur(${world.blur.toFixed(1)}px)`;
  }
}

function tick() {
  try {
    renderFrame();
  } catch (e) {
    state.error = 'tick: ' + (e && e.message ? e.message : String(e));
    state.tickErrors = (state.tickErrors || 0) + 1;
  }
  requestAnimationFrame(tick);
}

function renderFrame() {
  const dt = Math.min(clock.getDelta(), 0.1);
  const t = clock.elapsedTime;
  if (vrm) {
    nextBlink -= dt;
    if (nextBlink <= 0) { blink = 0.18; nextBlink = 2.2 + Math.random() * 3.4; }
    // The blink closes what the mood — or a yawn — has left open.
    const lids = state.lids ?? 0;
    if (blink > 0) {
      blink -= dt;
      vrm.expressionManager?.setValue('blink', Math.max(lids, Math.sin(Math.max(blink, 0) / 0.18 * Math.PI)));
    } else {
      vrm.expressionManager?.setValue('blink', lids);
    }

    // A motion file owns the body while it plays: the procedural idle below
    // would fight it bone for bone. The face keeps its own life — blinking
    // and the mouth are expressions, not bones.
    if (state.clip && mixer) {
      mixer.update(dt);
      if (performance.now() / 1000 > state.clipEnds) { kin.stopMotion(); }
      vrm.update(dt);
      state.frames++;
      renderer.render(scene, camera);
      return;
    }

    // Standing still, alive.
    //
    // Two sines and a blink is a statue with a tic: the loop is short enough
    // to notice, and noticing is what turns a person back into a widget. So
    // the idle is built out of things that do not line up — breath at its own
    // rate, a weight shift that wanders, and a glance away every so often
    // that returns on its own. Nothing here is large; it is the
    // *unpredictability* that reads as alive, not the amplitude.
    const bone = (n) => vrm.humanoid?.getNormalizedBoneNode(n);
    // Every frame starts from rest, and everything below is laid on top.
    // The idle only writes the joints it cares about, so whatever a motion
    // left in the others stayed there: a leg out to the side for the rest of
    // the evening, fingers still in a peace sign.
    for (const name of state.bones ?? []) { const b = bone(name); if (b) b.rotation.set(0, 0, 0); }
    // A 0.x rig is modelled facing the other way from a 1.0 one, and the
    // normalised bones keep that: the z-rotation that lowers a left arm on
    // one raises it on the other.
    const down = vrm.meta?.metaVersion === '0' ? 1 : -1;
    const chest = bone('chest') ?? bone('spine');
    const breath = Math.sin(t * 1.05) * 0.012 + Math.sin(t * 0.43) * 0.004;
    if (chest) chest.rotation.x = breath;

    // Weight on one foot, then the other, on a slow wander rather than a
    // metronome: three sines whose periods share no common multiple.
    // How much she moves is the mood's: tired barely shifts, happy cannot
    // keep still.
    const energy = feel.now?.energy ?? 1;
    const sway = (Math.sin(t * 0.21 * energy) * 0.6 + Math.sin(t * 0.13 * energy + 1.7) * 0.3
               + Math.sin(t * 0.07 + 0.4) * 0.1) * (0.6 + 0.4 * energy);
    const hips = bone('hips');
    if (hips) {
      hips.rotation.z = sway * 0.035;
      hips.position.x = sway * 0.012;
      hips.position.y = state.hipsRest;      // whatever bounced her last has ended
      hips.rotation.x = 0; hips.rotation.y = 0;
    }
    for (const [name, scale] of [['spine', -0.5], ['upperChest', -0.3]]) {
      const b = bone(name);
      if (b) b.rotation.z = sway * 0.035 * scale;
    }
    // Arms down, first of all.
    //
    // A VRM ships in its rest pose, which is a T: arms straight out to the
    // sides. Anything that only *adds* a little sway to that keeps the T,
    // which is what happened — she stood on the desktop with her arms out
    // like a scarecrow. So the pose is the base, and the life goes on top:
    // upper arms down by about 1.2 radians, a little elbow bend, and then the
    // sway and the gesture.
    const rest = 1.2, bend = 0.12;
    const gesture = state.talking ? 0.08 + 0.05 * Math.sin(t * 2.3) : 0;
    for (const [name, side] of [['leftUpperArm', 1], ['rightUpperArm', -1]]) {
      const b = bone(name);
      if (b) {
        b.rotation.z = down * side * (rest - gesture + 0.02 * sway);
        b.rotation.x = 0.06 * Math.sin(t * 0.31 + (side > 0 ? 0 : 1.1));
      }
    }
    for (const [name, side] of [['leftLowerArm', 1], ['rightLowerArm', -1]]) {
      const b = bone(name);
      if (b) b.rotation.z = down * side * (bend + gesture * 0.5);
    }

    // A glance away, now and then, that comes back by itself. Looking at one
    // point forever is the tell that nobody is home.
    glanceIn -= dt;
    if (glanceIn <= 0) {
      glance = { x: (Math.random() - 0.5) * 1.4, y: (Math.random() - 0.5) * 0.5,
                 left: 0.8 + Math.random() * 1.4 };
      glanceIn = 4 + Math.random() * 7;
    }
    if (glance) { glance.left -= dt; if (glance.left <= 0) glance = null; }

    const head = bone('head');
    if (head) {
      const away = glance ? glance.x : 0;
      head.rotation.y = Math.sin(t * 0.37) * 0.04 + away * 0.25;
      head.rotation.z = Math.sin(t * 0.29) * 0.02 + sway * 0.02;
      head.rotation.x = (glance ? glance.y : 0) * 0.15 + breath * 0.4;
    }
    if (glance && look) {
      // The eyes go with the glance, then find you again when it ends.
      look.position.x = glance.x * 0.5;
      look.position.y = look.userData.base + glance.y * 0.3;
    }

    applyMood(dt, t, bone);
    applyCarryAndSeat(dt, bone);
    if (framing === 'scene') liveInPlace(dt, t, bone);

    // The built-in dance: a bounce, a hip sway at half that rate, arms up and
    // swinging, head nodding with the beat. 112 bpm because it is the tempo
    // most people sway at without being asked.
    if (state.dance && !state.composed) {
      const beat = t * (112 / 60) * Math.PI;
      const bounce = Math.abs(Math.sin(beat)) * 0.06;
      const hipsB = bone('hips');
      if (hipsB) {
        hipsB.position.y = state.hipsRest + -bounce * 0.6;
        hipsB.rotation.z = Math.sin(beat / 2) * 0.12;
        hipsB.rotation.y = Math.sin(beat / 4) * 0.25;
      }
      for (const [name, side] of [['leftUpperArm', 1], ['rightUpperArm', -1]]) {
        const b = bone(name);
        if (b) {
          b.rotation.z = down * side * (0.9 + Math.sin(beat + (side > 0 ? 0 : Math.PI)) * 0.5);
          b.rotation.x = Math.sin(beat / 2) * 0.3;
        }
      }
      for (const [name, side] of [['leftLowerArm', 1], ['rightLowerArm', -1]]) {
        const b = bone(name);
        if (b) b.rotation.z = down * side * (0.8 + Math.sin(beat) * 0.4);
      }
      const headB = bone('head');
      if (headB) headB.rotation.x = Math.sin(beat) * 0.08;
    }

    // A motion she made up: over everything the idle, the walk and the dance
    // have just done.
    if (state.composed) applyComposed(dt, bone);
    if (framing !== 'scene') actor.rotation.y = (state.turn || 0) + (state.seatTurn || 0);
    mixFace(dt);

    // Talking. With a viseme track the five shapes are driven straight and
    // eased towards their targets — 0.35 a frame at 60fps is about 40ms to
    // settle, which is roughly how fast a mouth moves between vowels. Any
    // slower reads as mush, any faster as a puppet.
    const tracked = Object.values(state.visemes).some((v) => v > 0.001);
    if (tracked) {
      for (const shape of VISEMES) {
        const now = vrm.expressionManager?.getValue(shape) ?? 0;
        const next = now + (state.visemes[shape] - now) * 0.35;
        vrm.expressionManager?.setValue(shape, next);
        state.visemes[shape] *= 0.93;   // decays if the track stops feeding
      }
    } else {
      // No track: the old single shape, with a wobble so a steady level does
      // not look like a held note.
      const wobble = state.talking ? 0.12 + 0.1 * Math.sin(t * 11) : 0;
      const open = Math.max(0, Math.min(1, state.mouth * 0.8 + wobble));
      for (const shape of VISEMES) vrm.expressionManager?.setValue(shape, shape === 'aa' ? open : 0);
      state.mouth *= 0.86;
    }

    vrm.update(dt);
    placeProps();
  }
  state.frames++;
  renderer.render(scene, camera);
}
tick();

window.addEventListener('resize', resize);
new ResizeObserver(resize).observe(document.documentElement);
resize();

// The eyes follow the pointer when it is over the panel: the one interaction
// that makes a character feel present rather than played back.
window.addEventListener('pointermove', (e) => {
  const [w, h] = measure();
  kin.look((e.clientX / w) * 2 - 1, -((e.clientY / h) * 2 - 1));
});
</script>
</body>
</html>
